name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt psutil requests
      - name: Run tests
        run: python -m pytest -q

  nft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real nftables tests
        run: scripts/test.sh --nft

  panel:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Panel in a real browser
        run: scripts/test.sh --panel

  scenarios:
    runs-on: ubuntu-latest
    needs: [test, nft]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Attack and customer scenarios on SQLite and Postgres
        run: tests/e2e/run.sh

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
