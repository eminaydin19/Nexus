<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Nexus</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/chart.umd.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main" id="skip">Skip to content</a>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 17V3l14 14V3" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
        Nexus
      </div>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="overview">Overview</a>
        <a href="#/servers" data-nav="servers">Servers</a>
        <a href="#/blocks" data-nav="blocks">Blocks <span class="count" id="nBlocks"></span></a>
        <a href="#/watch" data-nav="watch">Watch <span class="count" id="nWatch"></span></a>
        <a href="#/events" data-nav="events">Events</a>
        <a href="#/settings" data-nav="settings">Settings</a>
      </nav>
    </aside>
    <main id="main" tabindex="-1">
      <p class="stale" id="stale" role="status" hidden></p>
      <div class="view" id="view"></div>
      <noscript><p>The Nexus panel needs JavaScript.</p></noscript>
    </main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
