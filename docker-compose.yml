services:
  nexus:
    build: .
    image: nexus:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    ports:
      - "${HTTP_BIND:-80}:8000"
    volumes:
      - nexus-data:/data
    mem_limit: 800m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: report this machine's own telemetry.  docker compose --profile agent up -d
  # Needs NEXUS_API_KEY to match INGEST_API_KEY in .env when that is set.
  agent:
    image: python:3.12-slim
    profiles: ["agent"]
    restart: unless-stopped
    depends_on:
      - nexus
    environment:
      NEXUS_URL: http://nexus:8000/api/ingest
      NEXUS_NODE_ID: ${NEXUS_NODE_ID:-docker-host}
      NEXUS_API_KEY: ${INGEST_API_KEY:-}
    volumes:
      - ./agent.py:/app/agent.py:ro
      - ./requirements-agent.txt:/app/requirements-agent.txt:ro
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -q -r requirements-agent.txt && python agent.py"
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - nexus
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    mem_limit: 64m

volumes:
  nexus-data:
  caddy-data:
