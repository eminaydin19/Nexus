worker_processes 2;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
events { worker_connections 30000; }
http {
    default_type text/plain;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    keepalive_timeout 900;
    keepalive_requests 1000000;
    server {
        listen 80 default_server;
        location = / { return 200 "home\n"; }
        location = /account { return 200 "account\n"; }
        location /page/ { return 200 "page\n"; }
        location = /search { return 200 "results\n"; }
        # Status alone tells the agent nothing on these paths, so the header stands in for a real password check.
        location = /login {
            if ($http_x_good_password) { return 302 /account; }
            return 401;
        }
        location / { return 404; }
    }
}
